{% extends "tracker/base.html" %}
{% block title %}Edit {{ equipment.label }}{% endblock %}
{% block content %}
<p><a class="back-link" href="{% url 'manage_view' %}">&larr; Manage Fleet</a></p>
<h1>Edit {{ equipment.label }}</h1>
<p class="muted" style="margin-top:0;">
  <a class="equip-link" href="{% url 'equipment_detail' equipment.pk %}">View this machine's operations page &rarr;</a>
</p>

<div class="card">
  <form method="post">
    {% csrf_token %}
    <div style="display:flex; flex-direction:column; gap:1rem; max-width:420px;">
      <div>
        <label class="muted" style="display:block; font-size:0.8rem; margin-bottom:0.25rem;">Label</label>
        <input type="text" name="label" value="{{ equipment.label }}" required style="width:100%; padding:0.55rem; border:1px solid var(--border); border-radius:6px;">
      </div>
      <div>
        <label class="muted" style="display:block; font-size:0.8rem; margin-bottom:0.25rem;">Customer</label>
        <select name="customer_id" required style="width:100%; padding:0.55rem; border:1px solid var(--border); border-radius:6px;">
          {% for c in customers %}<option value="{{ c.pk }}" {% if c.pk == equipment.customer_id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label class="muted" style="display:block; font-size:0.8rem; margin-bottom:0.25rem;">Site</label>
        <select name="site_id" style="width:100%; padding:0.55rem; border:1px solid var(--border); border-radius:6px;">
          <option value="">Unassigned</option>
          {% for s in sites %}<option value="{{ s.pk }}" {% if s.pk == equipment.site_id %}selected{% endif %}>{{ s.name }} ({{ s.customer.name }})</option>{% endfor %}
        </select>
      </div>
      <div>
        <label class="muted" style="display:block; font-size:0.8rem; margin-bottom:0.25rem;">Make</label>
        <input type="text" name="make" value="{{ equipment.make }}" style="width:100%; padding:0.55rem; border:1px solid var(--border); border-radius:6px;">
      </div>
      <div>
        <label class="muted" style="display:block; font-size:0.8rem; margin-bottom:0.25rem;">Model</label>
        <input type="text" name="model" value="{{ equipment.model }}" style="width:100%; padding:0.55rem; border:1px solid var(--border); border-radius:6px;">
      </div>
      <div>
        <label class="muted" style="display:block; font-size:0.8rem; margin-bottom:0.25rem;">Serial number</label>
        <input type="text" name="serial_number" value="{{ equipment.serial_number }}" style="width:100%; padding:0.55rem; border:1px solid var(--border); border-radius:6px;">
      </div>
      <button type="submit" style="padding:0.6rem 1.2rem; background:var(--accent); color:white; border:none; border-radius:6px; font-weight:600; cursor:pointer; width:fit-content;">Save changes</button>
    </div>
  </form>
</div>
{% endblock %}
