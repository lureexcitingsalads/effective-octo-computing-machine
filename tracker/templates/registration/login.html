{% extends "tracker/base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card" style="max-width:360px; margin:2rem auto;">
  <h1 style="font-size:1.3rem; margin-top:0;">Log in</h1>
  {% if form.errors %}
  <p style="color:var(--danger); font-size:0.9rem;">Incorrect username or password.</p>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <div style="margin-bottom:0.9rem;">
      <label for="id_username" style="display:block; font-size:0.85rem; color:var(--muted); margin-bottom:0.25rem;">Username</label>
      <input type="text" name="username" id="id_username" autofocus required style="width:100%; padding:0.5rem; border:1px solid var(--border); border-radius:6px;">
    </div>
    <div style="margin-bottom:1.1rem;">
      <label for="id_password" style="display:block; font-size:0.85rem; color:var(--muted); margin-bottom:0.25rem;">Password</label>
      <input type="password" name="password" id="id_password" required style="width:100%; padding:0.5rem; border:1px solid var(--border); border-radius:6px;">
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" style="width:100%; padding:0.6rem; background:var(--accent); color:white; border:none; border-radius:6px; font-weight:600; cursor:pointer;">Log in</button>
  </form>
</div>
{% endblock %}
